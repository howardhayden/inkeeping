name: Apply license policy

on:
  push:
    branches:
      - chore/license-policy-2026-08-24
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply scoped licenses and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LICENSES
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt \
            --output LICENSE
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/CC-BY-SA-4.0.txt \
            --output LICENSES/CC-BY-SA-4.0.txt

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          licensing = '''# Repository licensing

IN KEEPING combines interoperable application code, extensive professional documentation, original source identity, and third-party components. These categories use separate licenses so the software can be adopted broadly while improvements and documentation remain shareable.

## Software and mixed source files — MPL-2.0

Unless a file carries a more specific notice, application and worker source, tests, scripts, package manifests, configuration, format parsers, schema implementations, and other technical source files are licensed under the [Mozilla Public License 2.0](LICENSE).

A source file that combines executable code with embedded schemas, sample records, interface copy, or other data is treated as software under MPL-2.0. Modified MPL-covered files must remain available under MPL-2.0, while separate files in a larger work may use other compatible terms.

## Standalone documentation — CC BY-SA 4.0

Unless a file carries a more specific notice, original standalone documentation in `docs/`, repository governance and explanatory Markdown, and separately published notebook or report material are licensed under the [Creative Commons Attribution-ShareAlike 4.0 International License](LICENSES/CC-BY-SA-4.0.txt).

This Creative Commons license does not apply to software. It permits commercial and noncommercial reuse with attribution and requires adaptations to use the same license.

## Marks and source identity — reserved

The name **IN KEEPING**, project domains, logos, trade dress, and other source-identifying marks are not licensed as trademarks or service marks. Accurate descriptive and nominative use permitted by law remains unaffected.

## Third-party material

Third-party libraries, fonts, standards excerpts, icons, quotations, and other incorporated works retain their own notices and terms, including the notices in `THIRD_PARTY_NOTICES.md` and `public/fonts/OFL.txt`. Their specific terms override this repository-level map. No license is granted to material for which the licensor lacks authority.

## File-level priority

The most specific notice controls. A notice in a file or its containing directory overrides this map. Generated output follows the license of the source material from which it is produced unless the output carries a different notice.

## Contributions

By submitting a contribution, a contributor represents that they have the right to submit it and agrees to license it under the terms governing the affected material in this file. Third-party material must retain its original notices and terms.

## Effective revision and earlier MIT copies

This policy applies to revisions committed on or after **August 24, 2026**. It does not revoke rights already received in an earlier copy under the MIT License that accompanied that copy. Earlier MIT-licensed revisions remain available under their prior terms.
'''
          (root / 'LICENSING.md').write_text(licensing, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8').rstrip()
          section = '''## License

IN KEEPING uses scoped licensing: software and mixed technical source files are [MPL-2.0](LICENSE), while original standalone documentation is [CC BY-SA 4.0](LICENSES/CC-BY-SA-4.0.txt). Project marks are reserved, and third-party materials retain their own terms. See [LICENSING.md](LICENSING.md) for the controlling file-level rules and the notice preserving rights in earlier MIT-licensed revisions.'''
          pattern = re.compile(r'(?ms)^## License\n.*?(?=^## |\Z)')
          if pattern.search(readme):
              readme = pattern.sub(section + '\n\n', readme).rstrip()
          else:
              readme += '\n\n' + section
          readme_path.write_text(readme + '\n', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['license'] = 'MPL-2.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          lock_path = root / 'package-lock.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock.setdefault('packages', {}).setdefault('', {})['license'] = 'MPL-2.0'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')

          citation_path = root / 'CITATION.cff'
          citation = citation_path.read_text(encoding='utf-8')
          citation, count = re.subn(r'(?m)^license:\s*.*$', 'license: MPL-2.0', citation)
          if count != 1:
              raise SystemExit('Expected exactly one license field in CITATION.cff')
          citation_path.write_text(citation, encoding='utf-8')

          contributing_path = root / 'CONTRIBUTING.md'
          contributing = contributing_path.read_text(encoding='utf-8').rstrip()
          contribution_section = '''## Contribution licensing

By submitting a contribution, you represent that you have the right to submit it and agree to license it under the license governing the affected material in [LICENSING.md](LICENSING.md). Code and mixed source files follow MPL-2.0; separately licensed documentation follows CC BY-SA 4.0. Third-party material must retain its original notices and terms.'''
          contribution_pattern = re.compile(r'(?ms)^## Contribution licensing\n.*?(?=^## |\Z)')
          if contribution_pattern.search(contributing):
              contributing = contribution_pattern.sub(contribution_section + '\n\n', contributing).rstrip()
          else:
              contributing += '\n\n' + contribution_section
          contributing_path.write_text(contributing + '\n', encoding='utf-8')
          PY

          npm ci
          npm run release:check

          rm .github/workflows/license-policy-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply scoped IN KEEPING licensing"
          git push origin HEAD:"${TARGET_BRANCH}"
